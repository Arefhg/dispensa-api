name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dispensa
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: dispensa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispensa -d dispensa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://dispensa:test-password@127.0.0.1:5432/dispensa
      TEST_DATABASE_URL: postgresql+psycopg://dispensa:test-password@127.0.0.1:5432/dispensa_test
      ENVIRONMENT: development
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRE_MINUTES: 480

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app tests migrations scripts

      - name: Pytest
        run: pytest --cov-fail-under=80

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo '```'
            coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
